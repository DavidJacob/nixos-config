# ~/.config/hypr/hyprlock.conf: plain lock screen

background {
    color = rgb(1e1e2e)
}

label {
    text = $TIME
    font_size = 64
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center
    placeholder_text = Password
}
